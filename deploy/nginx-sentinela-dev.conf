# Sentinela — DESENVOLVIMENTO REMOTO. Instalado em /etc/nginx/sites-available/sentinela-dev
# Front, API (/api), WebRTC/WHEP (/mtx/webrtc) e HLS (/mtx/hls) no mesmo origin, porta 8182.

server {
    listen 8182;
    listen [::]:8182;
    server_name _;
    client_max_body_size 20m;

    # API. SSE (/api/stream) exige buffering desligado.
    # Sem access log aqui: SSE e imagens levam o token de sessão em ?token=; a API
    # já registra as requisições com o token mascarado.
    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:13333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Sinalização WHEP do MediaMTX (a mídia vai direto pela 8189/udp).
    location /mtx/webrtc/ {
        proxy_pass http://127.0.0.1:18889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_redirect / /mtx/webrtc/;
    }

    # HLS do MediaMTX (fallback do player).
    location /mtx/hls/ {
        proxy_pass http://127.0.0.1:18888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:13010;
        proxy_set_header Host $host;
    }
}
